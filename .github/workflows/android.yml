# Game-free checks of the Android port: the policy, build and entry tests (tests/android_*_test.py)
# with Linux GCC and Clang and macOS Clang, and an NDK build of the Android GPU and TLS test fixtures.
name: Android

# Only a published release runs it (the launcher's release workflow publishes them here): no pull
# requests, no pushes to main, no runs by hand.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  policy:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            cc: clang
            cxx: clang++
          - os: ubuntu-24.04
            cc: gcc
            cxx: g++
          - os: ubuntu-24.04
            cc: clang
            cxx: clang++
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Android policy, build and entry checks
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          python3 tests/android_policy_test.py
          python3 tests/android_build_test.py
          python3 tests/android_entry_test.py

  android-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;27.0.12077973'
      - name: Build Android dependencies and game-free GPU fixture
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.0.12077973"
          python3 tools/android_deps.py
          python3 tools/build_android.py gfxtest --native-tls --test gfx_async
          python3 tools/build_android.py tls-test --native-tls
