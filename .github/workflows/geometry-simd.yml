# Game-free checks of the shared geometry kernels and their guarded adapters (tests/geometry_simd_test.py,
# tests/geometry_guest_test.py) with macOS Clang, Linux GCC and Clang, and Windows MSVC, and under the
# sanitizers on macOS and Linux.
name: Shared geometry

# Only a published release runs it (the launcher's release workflow publishes them here): no pull
# requests, no pushes to main, no runs by hand.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  differential:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            cc: clang
            cxx: clang++
          - os: ubuntu-24.04
            cc: gcc
            cxx: g++
          - os: ubuntu-24.04
            cc: clang
            cxx: clang++
          - os: windows-2022
            cc: cl
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: SIMD and scalar differential checks
        if: runner.os != 'Windows'
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          python3 tests/geometry_simd_test.py
          python3 tests/geometry_guest_test.py
      - name: Address and undefined-behavior checks
        if: runner.os != 'Windows'
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
          CFLAGS: '-fsanitize=address,undefined -fno-omit-frame-pointer'
        run: |
          python3 tests/geometry_simd_test.py
          python3 tests/geometry_guest_test.py
      - name: MSVC x64 differential checks
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CC: cl
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw 'Visual Studio x64 tools unavailable' }
          & cmd.exe /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" && python tests/geometry_simd_test.py && python tests/geometry_guest_test.py"
          exit $LASTEXITCODE
